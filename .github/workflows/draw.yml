name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      # nemu-link-dongle.keymap only includes nickey44a.keymap; draw that one.
      keymap_patterns: "config/nickey44a.keymap"
      output_folder: "keymap-drawer"
