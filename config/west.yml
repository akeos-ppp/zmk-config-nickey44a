manifest:
  remotes:
    - name: caksoylar  # <-- RGB LED
      url-base: https://github.com/caksoylar
    - name: akeos-ppp  # <-- IQS9151 driver fork (LalaPad Gen2 trackpad + Nickey36A patch)
      url-base: https://github.com/akeos-ppp
    - name: kot149  # <-- scroll snap
      url-base: https://github.com/kot149
  projects:
    # nemu-link: ZMK fork (Zephyr 4.1) + 2.4GHz receiver/peripheral module
    - name: zmk
      url: https://github.com/sekigon-gonnoc/zmk
      revision: v0.4+nemu-link
      import: app/west.yml
    - name: zmk-feature-nemu-link
      url: https://github.com/sekigon-gonnoc/zmk-feature-nemu-link
      revision: zmk-v0.4
      import: config/west.yml
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
    - name: zmk-driver-iqs9151
      remote: akeos-ppp
      # nickey36a-haptics + DRV2605 compatible renamed to "zmk,drv2605"
      # ("ti,drv2605" clashes with the Zephyr 4.1 haptics binding)
      revision: nickey36a-haptics-zephyr4
    - name: zmk-scroll-snap
      remote: kot149
      revision: v1
  self:
    path: config
