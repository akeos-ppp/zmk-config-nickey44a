# nemu-link: 2.4GHz only (BLE / USB HID off; the dongle talks to the host)
CONFIG_ZMK_NEMU_LINK=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=n
CONFIG_ZMK_SPLIT_BLE=n

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# IQS9151 (Azoteq, LalaPad Gen2 trackpad) pointing device
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_IQS9151=y
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# IQS9151 tuning (LalaPad Gen2 trackpad_tmn10 branch, right side)
CONFIG_INPUT_IQS9151_ROTATE_0=y
CONFIG_INPUT_IQS9151_RESOLUTION_X=2457
CONFIG_INPUT_IQS9151_RESOLUTION_Y=3072
CONFIG_INPUT_IQS9151_ATI_TARGETCOUNT=400
CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_BOTTOM_SPEED=10
CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_TOP_SPEED=700
CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_BOTTOM_BETA=5
CONFIG_INPUT_IQS9151_1F_TAP_ENABLE=y
CONFIG_INPUT_IQS9151_1F_TAP_MAX_MS=180
CONFIG_INPUT_IQS9151_1F_TAP_MOVE=50
CONFIG_INPUT_IQS9151_1F_PRESSHOLD_ENABLE=y
CONFIG_INPUT_IQS9151_1F_TAPDRAG_GAP_MAX_MS=160
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_ENABLE=n
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_DECAY=950
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_RECENT_WINDOW_MS=60
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_STALE_GAP_MS=35
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_MIN_SAMPLES=2
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_MIN_AVG_SPEED=10
CONFIG_INPUT_IQS9151_2F_TAP_ENABLE=y
CONFIG_INPUT_IQS9151_2F_TAP_MAX_MS=250
CONFIG_INPUT_IQS9151_2F_TAP_MOVE=50
CONFIG_INPUT_IQS9151_2F_PRESSHOLD_ENABLE=y
CONFIG_INPUT_IQS9151_2F_TAPDRAG_GAP_MAX_MS=200
CONFIG_INPUT_IQS9151_SCROLL_Y_ENABLE=y
CONFIG_INPUT_IQS9151_SCROLL_X_ENABLE=y
CONFIG_INPUT_IQS9151_2F_SCROLL_START_MOVE=50
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_ENABLE=n
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_DECAY=0
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_RECENT_WINDOW_MS=60
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_STALE_GAP_MS=35
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_MIN_SAMPLES=1
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_MIN_AVG_SPEED=3
CONFIG_INPUT_IQS9151_2F_PINCH_ENABLE=y
CONFIG_INPUT_IQS9151_2F_PINCH_START_DISTANCE=100
# Raised with the scroll scaler (1/12 -> 1/48) so pinch zoom keeps its speed.
CONFIG_INPUT_IQS9151_2F_PINCH_WHEEL_GAIN_X10=40
CONFIG_INPUT_IQS9151_3F_TAP_ENABLE=y
CONFIG_INPUT_IQS9151_3F_TAP_MAX_MS=200
CONFIG_INPUT_IQS9151_3F_TAP_MOVE=35
CONFIG_INPUT_IQS9151_3F_PRESSHOLD_ENABLE=n
CONFIG_INPUT_IQS9151_3F_TAPDRAG_GAP_MAX_MS=200
CONFIG_INPUT_IQS9151_3F_SWIPE_THRESHOLD=200
CONFIG_INPUT_IQS9151_DRAG_LOCK_ENABLE=y
CONFIG_INPUT_IQS9151_FINGER_COUNT_DEBOUNCE_ENABLE=y
# TPS43-style press-and-hold drag: touch and stay still for 600 ms to press
# the left button and drag (tap -> touch-again drag also stays available).
# With drag lock the button stays down after lifting; the next single tap
# releases it without clicking. Long-press is limited to one finger so that
# resting two or three fingers never holds right click / Launchpad.
# (LONG_PRESS_HOLD_1F_ONLY and DRAG_LAYER come from the akeos-ppp driver fork.)
CONFIG_INPUT_IQS9151_LONG_PRESS_HOLD_ENABLE=y
CONFIG_INPUT_IQS9151_LONG_PRESS_HOLD_MS=600
CONFIG_INPUT_IQS9151_LONG_PRESS_HOLD_MOVE=80
CONFIG_INPUT_IQS9151_LONG_PRESS_HOLD_1F_ONLY=y
# The "Drag" layer (layer 4) cannot be held from here: with nemu-link the
# keymap lives on the dongle, so the driver compiles the drag layer out.

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
# Layer colors are not available: layers live on the nemu-link dongle.

# No haptics on the right: the DRV2605L / VG0825001U board was removed,
# so the DRV2605 driver and IQS9151 haptic feedback stay disabled here.
