# nemu-link 2.4GHz only build.
#   Left  half: PERIPHERAL_ID 0
#   Right half: PERIPHERAL_ID 1
#   nemu-link dongle: split central + USB HID (keymap, combos, pad processing)
# Flash all three, then register the same key/address on all three with
# nemu-link studio (https://nemu-link-studio.pages.dev/).
---
include:
  - board: xiao_ble//zmk
    shield: nickey44a_l rgbled_adapter
    cmake-args: -DCONFIG_ZMK_NEMU_LINK_PERIPHERAL_ID=0
    artifact-name: nickey44a_l-nemu-link
  - board: xiao_ble//zmk
    shield: nickey44a_r rgbled_adapter
    cmake-args: -DCONFIG_ZMK_NEMU_LINK_PERIPHERAL_ID=1
    artifact-name: nickey44a_r-nemu-link
  - board: nemu-link-dongle
    snippet: studio-rpc-usb-uart
    artifact-name: nemu-link-dongle
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset
  - board: nemu-link-dongle
    shield: settings_reset
    artifact-name: nemu-link-dongle_settings_reset
