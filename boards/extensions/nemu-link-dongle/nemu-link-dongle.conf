# nemu-link dongle: USB name and the name reported to Studio
CONFIG_USB_DEVICE_PRODUCT="Nickey36A nemu-link"
CONFIG_ZMK_KEYBOARD_NAME="Nickey36A"

# Studio over USB (needs the studio-rpc-usb-uart snippet, set in build.yaml)
CONFIG_ZMK_STUDIO=y

# Pointing: both IQS9151 pads are processed here (moved from the right half)
CONFIG_ZMK_POINTING=y
# macOS ignores the HID wheel resolution multiplier, so smooth scrolling made
# Mac scroll ~16x faster than Windows. Off = one wheel unit is one notch on
# every host; speed is set by zip_scroll_scaler in nemu-link-dongle.overlay.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n
