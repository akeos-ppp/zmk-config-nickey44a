description: Turns TPS43 pinch (zoom gesture) motion into modifier + vertical wheel (Option+scroll zoom)
compatible: "zmk,input-processor-pinch-keys"
include: ip_zero_param.yaml
properties:
  zoom-code:
    type: int
    required: true
    description: Relative code carrying the driver's signed zoom amount (INPUT_REL_MISC).
  step:
    type: int
    default: 30
    description: Zoom units (permille of pad width) per wheel tick. Larger means slower zoom.
  modifier-keycode:
    type: int
    required: true
    description: Encoded ZMK keycode held while pinching (LALT for macOS Option).
  invert-wheel:
    type: boolean
    description: Send wheel down for fingers apart instead of wheel up.
